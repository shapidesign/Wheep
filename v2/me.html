<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16130F">
<title>WHEEP · היום שלך</title>
<link rel="stylesheet" href="v2.css">
<style>
  /* the visitor's phone: dark, like the app */
  :root { --ground: #16130F; --panel: #24211C; --line: rgba(255, 255, 255, .22); }
  body { background: var(--ground); color: #fff; min-height: 100svh; font-variation-settings: 'wght' 40; }
  ::selection { background: #FFD23F; color: var(--ground); }
  .screen { min-height: 100svh; display: none; flex-direction: column; padding: 28px 22px calc(28px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; }
  .screen.on { display: flex; }
  .top { display: flex; justify-content: space-between; align-items: center; direction: ltr; }
  .top svg { width: 30px; height: 30px; }
  .top span { font-size: 22px; font-variation-settings: 'wght' 90; }
  .hero-mark { width: min(60vw, 260px); aspect-ratio: 1; margin: 48px auto 32px; display: block; }
  h1 { font-size: clamp(36px, 10vw, 48px); line-height: 1.05; font-variation-settings: 'wght' 90; }
  .sub { font-size: 19px; line-height: 1.45; margin-top: 12px; color: rgba(255, 255, 255, .78); max-width: 34ch; }
  form { margin-top: auto; display: grid; gap: 14px; padding-top: 32px; }
  label { font-size: 17px; font-variation-settings: 'wght' 70; }
  input { font: inherit; font-size: 24px; color: #fff; background: var(--panel); border: 1.5px solid var(--line); border-radius: 0; padding: 14px 16px; font-variation-settings: 'wght' 60; }
  input:focus-visible, button:focus-visible { outline: 3px solid #FFD23F; outline-offset: 3px; }
  .err { color: #FF9F1C; font-size: 16px; min-height: 1.4em; }
  button { font: inherit; font-size: 21px; padding: 16px 18px; border: 0; border-radius: 0; cursor: pointer; font-variation-settings: 'wght' 85; }
  .primary { background: #fff; color: var(--ground); }
  .primary:active { transform: translateY(1px); }
  .quiet { background: transparent; color: #fff; border: 1.5px solid var(--line); }
  /* detecting */
  .status { list-style: none; margin-top: 8px; display: grid; gap: 12px; font-size: 20px; }
  .status li { opacity: 0; transform: translateY(8px); transition: opacity .35s cubic-bezier(.16, 1, .3, 1), transform .35s cubic-bezier(.16, 1, .3, 1); }
  .status li.on { opacity: 1; transform: none; }
  .status b { font-variation-settings: 'wght' 90; font-weight: inherit; direction: ltr; unicode-bidi: isolate; }
  .bar { height: 6px; background: var(--line); margin-top: 22px; }
  .bar i { display: block; height: 100%; width: 0; background: #fff; transition: width .2s linear; }
  /* the story */
  /* the story fills the phone: the frame is sized to the width, its ground runs on to the real screen edge */
  #story.screen { position: fixed; inset: 0; padding: 0; max-width: none; overflow: hidden; background: var(--ground); }
  #story svg { position: absolute; left: 50%; top: 46%; translate: -50% -50%; width: min(100vw, calc(86svh * 1080 / 1350)); height: auto; overflow: visible; }
  .dock { position: absolute; inset: auto 0 0 0; display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center;
    padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); background: rgba(22, 19, 15, .86); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .dock input { font-size: 18px; padding: 11px 12px; min-width: 0; }
  .dock button { font-size: 16px; padding: 12px 14px; white-space: nowrap; }
  /* stories: a strip of days on top, tap zones over the frame (tap = scene, swipe = day, hold = pause) */
  .days { position: absolute; inset: calc(10px + env(safe-area-inset-top)) 12px auto 12px; z-index: 2; display: flex; gap: 4px; direction: rtl; }
  .days span { flex: 1; height: 3px; background: rgba(255, 255, 255, .3); position: relative; overflow: hidden; }
  .days span i { position: absolute; inset: 0; background: #fff; transform-origin: right; transform: scaleX(0); }
  .dayname { position: absolute; inset: calc(22px + env(safe-area-inset-top)) 14px auto auto; z-index: 2; font-size: 15px; font-variation-settings: 'wght' 80; color: #fff; mix-blend-mode: difference; }
  /* touch-action none: the page never scrolls here, and pan-y let the browser cancel a tap that moved a few px */
  .taps { position: absolute; inset: 0; z-index: 1; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: pointer; }
  .hint { position: absolute; inset: auto 0 96px 0; z-index: 2; text-align: center; font-size: 16px; color: #fff; pointer-events: none;
    transition: opacity .6s cubic-bezier(.16, 1, .3, 1); text-shadow: 0 1px 8px rgba(0, 0, 0, .5); }
  .hint.off { opacity: 0; }
  .dock { z-index: 3; }
  /* paused, like TikTok: a tap in the middle stops the story, another plays it on */
  .paused { position: absolute; inset: calc(46px + env(safe-area-inset-top)) 0 auto 0; margin-inline: auto; width: max-content; z-index: 2; padding: 8px 14px;
    background: rgba(22, 19, 15, .86); color: #fff; font-size: 15px; font-variation-settings: 'wght' 70; pointer-events: none;
    opacity: 0; transform: translateY(-6px); transition: opacity .2s ease-out, transform .2s ease-out; }
  .paused.on { opacity: 1; transform: none; }
  /* the end of each day: share the final poster */
  .endshare { position: absolute; inset: auto 16px calc(84px + env(safe-area-inset-bottom)) 16px; z-index: 3; display: grid; gap: 6px;
    opacity: 0; transform: translateY(16px); pointer-events: none; transition: opacity .45s cubic-bezier(.16, 1, .3, 1), transform .45s cubic-bezier(.16, 1, .3, 1); }
  .endshare.on { opacity: 1; transform: none; pointer-events: auto; }
  .endshare button { font-size: 22px; padding: 18px; background: #fff; color: var(--ground); box-shadow: 0 8px 28px rgba(0, 0, 0, .35); }
  .endshare p { font-size: 15px; text-align: center; color: #fff; text-shadow: 0 1px 8px rgba(0, 0, 0, .5); min-height: 1.3em; }
  @media (prefers-reduced-motion: reduce) { .endshare { transition: none; } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  @media (prefers-reduced-motion: reduce) { .status li { transition: none; } }
</style>
</head>
<body>

<section class="screen on" id="ask" aria-labelledby="askTitle">
  <div class="top"><svg viewBox="-52 -52 104 104" aria-hidden="true"><path id="topMark" fill="#fff"/></svg><span>wheep</span></div>
  <svg class="hero-mark" viewBox="-60 -60 120 120" aria-hidden="true"><path id="bigMark" fill="#fff"/></svg>
  <h1 id="askTitle">היום שלך, בסיכום אחד.</h1>
  <p class="sub">החיישן מדד את היום שלך. נחבר אותו, ותקבל סיפור קצר על מה שהרגשת ומתי.</p>
  <form id="form" novalidate>
    <label for="name">איך קוראים לך?</label>
    <input id="name" name="name" autocomplete="given-name" maxlength="20" required placeholder="השם שלך">
    <p class="err" id="err" role="alert"></p>
    <button class="primary" type="submit">חבר את החיישן</button>
  </form>
</section>

<section class="screen" id="detect" aria-live="polite">
  <div class="top"><svg viewBox="-52 -52 104 104" aria-hidden="true"><path id="topMark2" fill="#fff"/></svg><span>wheep</span></div>
  <svg class="hero-mark" viewBox="-60 -60 120 120" aria-hidden="true"><path id="scanMark" fill="#fff"/></svg>
  <h1 id="hello"></h1>
  <ul class="status" id="status"></ul>
  <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
</section>

<section class="screen" id="story" aria-roledescription="סיפורים">
  <svg id="storySvg"></svg>
  <div class="days" id="days" aria-hidden="true"></div>
  <p class="dayname" id="dayname" aria-live="polite"></p>
  <div class="taps" id="taps" role="button" tabindex="0" aria-label="הסטורי זז מימין לשמאל: הקשה בקצה השמאלי לסטורי הבא, בקצה הימני לקודם, באמצע עוצר וממשיך. רווח עוצר. חצים: שמאלה קדימה, ימינה אחורה"></div>
  <p class="paused" id="pausedBadge" aria-live="polite"></p>
  <p class="hint" id="hint">שמאל: הבא · ימין: הקודם · אמצע: עצירה · החלקה: יום אחר</p>
  <div class="dock">
    <label class="sr" for="liveName">השם שלך בסיכום</label>
    <input id="liveName" maxlength="20" autocomplete="given-name" enterkeyhint="done" aria-describedby="liveHint">
    <span class="sr" id="liveHint">אם תשנה את השם, הסיפור שלך יתחיל מחדש בשם החדש</span>
    <button class="quiet" type="button" id="again">מההתחלה</button>
    <button class="primary" type="button" id="save">שמור תמונה</button>
  </div>
  <div class="endshare" id="endshare">
    <button type="button" id="share">שתף את הפוסטר שלך</button>
    <p id="shareNote" aria-live="polite"></p>
  </div>
</section>

<script src="shape.js"></script>
<script src="motion.js"></script>
<script src="copy.js"></script>
<script src="days.js"></script>
<script src="gen.js"></script>
<script src="story-core.js"></script>
<script src="story.js"></script>
<script src="summary.js"></script>
<script src="sync.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const show = id => document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));

  // idle mark: drifts through all seven feelings (the logo's behaviour)
  const FEELS = Object.keys(EMO);   // not KEYS: shape.js owns that name
  function markAt(t) {
    const pos = (t / 2600) % FEELS.length, i = Math.floor(pos), f = pos - i;
    const a = EMO[FEELS[i]].n, b = EMO[FEELS[(i + 1) % FEELS.length]].n;
    const nn = b > a ? a + (b - a) * mSmooth(f) : (f < .5 ? a : b);
    return { n: nn, k: .5 + .5 * Math.sin(t / 1400) };
  }
  let scanning = false, story = null, clock = 0, last = null, paused = false;
  function tick(t) {
    const m = markAt(t);
    const d = shapePath(m.n, m.k, 48, 0, 0, t / 6000);
    $('topMark').setAttribute('d', d); $('topMark2').setAttribute('d', d);
    $('bigMark').setAttribute('d', shapePath(m.n, m.k, 56, 0, 0, t / 6000));
    if (scanning) $('scanMark').setAttribute('d', shapePath(m.n, .5 + .5 * Math.sin(t / 260), 40 + 10 * Math.sin(t / 180), 0, 0, t / 900));
    const dt = last === null ? 0 : (t - last) / 1000; last = t;
    if (story) {
      if (!paused) clock += dt;
      if (clock >= STORY_DUR) clock = STORY_DUR - .001;   // the day is over: hold on the share card, to save or share it (tap or swipe for the next day)
      story.draw(reduce ? built(clock) : clock);
      fillDays();
      $('endshare').classList.toggle('on', clock >= SCENES[SCENES.length - 2]);   // the last poster: offer to share it
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // 1 · the name
  $('form').addEventListener('submit', ev => {
    ev.preventDefault();
    const name = $('name').value.trim().replace(/\s+/g, ' ');
    if (!name) { $('err').textContent = 'כתוב את השם שלך כדי לחבר את החיישן.'; $('name').focus(); return; }
    $('err').textContent = '';
    detect(name);
  });

  // 2 · "detecting" the sensor (the read is real for the story: same name, same day, same data)
  const wait = ms => new Promise(r => setTimeout(r, reduce ? Math.min(ms, 150) : ms));
  async function detect(name) {
    show('detect'); scanning = true;
    $('hello').textContent = `${name}, מחפשים את החיישן שלך.`;
    const ul = $('status'); ul.textContent = '';
    const line = html => { const li = document.createElement('li'); li.innerHTML = html; ul.append(li); requestAnimationFrame(() => li.classList.add('on')); };
    const bar = $('barFill'); bar.style.width = '0';
    line('מחפש את חיישן ה־WHEEP שלך…'); await wait(1300);
    line(`נמצא חיישן: <b>${sensorId(name)}</b>`); await wait(900);
    line('מסנכרן את היום שלך…');
    for (let p = 0; p <= 100; p += 4) { bar.style.width = p + '%'; await wait(55); }
    const day = makeDay({ name, date: new Date() });
    line(`מוכן. הרגש שהוביל את היום שלך: <b>${EMO[day.emo].he}</b>`); await wait(1000);
    scanning = false;
    playName(name);
  }

  // 3 · the stories (full screen): today first, then the five days before it, each led by a different feeling.
  //     Tap the left side for the next scene, the right side for the one before (mirrored, for Hebrew);
  //     swipe for another day; hold to pause. The name stays editable: a new name starts the stories again in it.
  let week = [], d = 0, current = null;
  function weekOf(name) {
    const today = makeDay({ name, date: new Date() });   // the same day the exhibition screen shows for this name
    const rest = PROFILES.map(p => p.emo).filter(e => e !== today.emo), from = Math.floor(mHash(nameSeed(name, 'week'), 2, 2) * rest.length);
    return [today, ...rest.map((e, i) => makeDay({ name, date: new Date(Date.now() - (i + 1) * 864e5), top: rest[(from + i) % rest.length] }))];
  }
  const sceneT = i => SCENES[i];
  // reduced motion still plays every story from the start; each one just appears fully built instead of moving
  const built = c => { let i = 0; while (i < SCENES.length - 2 && c >= SCENES[i + 1]) i++; return SCENES[i + 1] - .05; };
  function go(i, t = 0) {
    d = (i + week.length) % week.length;
    current = week[d];
    story = createStory($('storySvg'), current, { bleed: true });
    clock = t; last = null;
    if (tapPaused) setPaused(false);   // another day starts playing
    $('dayname').textContent = d === 0 ? 'היום' : d === 1 ? 'אתמול' : `יום ${current.day}`;
    [...$('days').children].forEach((s, j) => s.firstChild.style.transform = `scaleX(${j < d ? 1 : 0})`);
  }
  function fillDays() { const s = $('days').children[d]; if (s) s.firstChild.style.transform = `scaleX(${Math.min(1, clock / STORY_DUR)})`; }
  function scene(step) {
    let i = 0; while (i < SCENES.length - 2 && clock >= SCENES[i + 1]) i++;
    if (step > 0) { if (i < SCENES.length - 2) clock = sceneT(i + 1); else go(d + 1); }
    else if (clock - SCENES[i] > 1.2) clock = sceneT(i);                 // back: first to the start of this scene
    else if (i > 0) clock = sceneT(i - 1);
    else if (d > 0) go(d - 1, sceneT(SCENES.length - 2));
    else clock = 0;
  }
  function playName(name) {
    show('story');
    week = weekOf(name);
    $('days').innerHTML = week.map(() => '<span><i></i></span>').join('');
    go(0);
    if (document.activeElement !== $('liveName')) $('liveName').value = name;
    history.replaceState(null, '', `?name=${encodeURIComponent(name)}`);
    syncSend(name);   // the exhibition screen picks it up and plays today's story too
    setTimeout(() => $('hint').classList.add('off'), 3500);
  }
  let tapPaused = false;
  function setPaused(on) {
    tapPaused = on; paused = on;
    $('pausedBadge').textContent = on ? 'מושהה · הקש באמצע להמשך' : '';
    $('pausedBadge').classList.toggle('on', on);
  }
  let down = null, holding = false, holdT = null, handled = 0;
  // a tap on the story: left edge = next, right edge = back (the story moves right to left), the middle pauses
  const tapAt = clientX => {
    handled = performance.now();
    const r = $('storySvg').getBoundingClientRect(), x = (clientX - r.left) / r.width;   // on the poster, not the window
    if (x < .3) scene(1); else if (x > .7) scene(-1); else setPaused(!tapPaused);
  };
  $('taps').addEventListener('pointerdown', ev => {
    down = { x: ev.clientX, y: ev.clientY, t: performance.now() };
    // hold-to-pause is a touch gesture, and only a real hold (0.45 s): a relaxed finger tap lasts 0.2–0.3 s
    if (ev.pointerType !== 'mouse') holdT = setTimeout(() => { holding = true; paused = true; }, 450);
  });
  const release = ev => {
    if (!down) return;
    clearTimeout(holdT);
    const dx = ev.clientX - down.x, dy = ev.clientY - down.y, long = performance.now() - down.t; down = null;
    if (holding) {
      holding = false; paused = tapPaused;
      if (long > 600 || Math.abs(dx) > 28 || Math.abs(dy) > 28) { if (tapPaused) setPaused(false); return; }   // a real hold: it only paused while held
    }
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { handled = performance.now(); go(d + (dx > 0 ? 1 : -1)); }   // swipe right = the next day
    else if (Math.abs(dx) < 28 && Math.abs(dy) < 28) tapAt(ev.clientX);   // a finger always moves a little: up to 28 px is still a tap
  };
  $('taps').addEventListener('pointerup', release);
  $('taps').addEventListener('pointercancel', () => { clearTimeout(holdT); down = null; holding = false; paused = tapPaused; });
  // fallback: if a browser ever drops the pointer events of a tap, its click still arrives
  $('taps').addEventListener('click', ev => { if (performance.now() - handled > 500) tapAt(ev.clientX); });
  $('taps').addEventListener('contextmenu', ev => ev.preventDefault());
  $('taps').addEventListener('keydown', ev => {
    if (ev.key === 'ArrowLeft') scene(1); else if (ev.key === 'ArrowRight') scene(-1);
    else if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); setPaused(!tapPaused); }
  });
  let typing = null;
  $('liveName').addEventListener('input', () => {
    clearTimeout(typing);
    typing = setTimeout(() => {
      const name = $('liveName').value.trim().replace(/\s+/g, ' ');
      if (name && (!current || name !== current.name)) playName(name);
    }, 450);
  });
  $('liveName').addEventListener('keydown', ev => { if (ev.key === 'Enter') $('liveName').blur(); });
  $('again').addEventListener('click', () => go(0));
  // 4 · the final poster as a PNG: save it, or share it with friends (the poster, a line, and a link to this story)
  async function busy(b, doing, job) {
    const label = b.textContent; b.disabled = true; b.textContent = doing;
    try { return await job(); } catch (e) { b.textContent = 'לא הצליח, נסה שוב'; await wait(1600); } finally { b.disabled = false; b.textContent = label; }
  }
  $('save').addEventListener('click', () => current && busy($('save'), 'שומר…', () => savePoster(current)));
  $('share').addEventListener('click', async () => {
    if (!current) return;
    paused = true;   // hold the last poster while the share sheet is open
    const link = new URL(`me.html?name=${encodeURIComponent(current.name)}`, location.href).href;
    const r = await busy($('share'), 'מכין את הפוסטר…', () => sharePoster(current, link));
    $('shareNote').textContent = r === 'copied' ? 'הפוסטר ירד, והקישור הועתק. אפשר להדביק אותו לחברים.' : r === 'shared' ? 'נשלח.' : '';
    paused = tapPaused;
  });

  // a shared link (?name=) goes straight to the story
  const pre = new URLSearchParams(location.search).get('name');
  document.fonts.ready.then(() => { if (pre) playName(pre.trim().slice(0, 20)); });
</script>
</body>
</html>
