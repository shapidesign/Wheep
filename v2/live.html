<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WHEEP · חי</title>
<link rel="stylesheet" href="v2.css">
<style>
  /* the exhibition screen: a QR on the right, a live story on the left */
  body { background: #16130F; color: #fff; min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); align-items: center; gap: 4vw; padding: 4vh 5vw; font-variation-settings: 'wght' 40; }
  .call { display: grid; gap: 3vh; align-content: center; }
  .call h1 { font-size: clamp(40px, 5.2vw, 96px); line-height: 1; font-variation-settings: 'wght' 95; }
  .call p { font-size: clamp(18px, 1.6vw, 28px); line-height: 1.4; max-width: 30ch; color: rgba(255, 255, 255, .8); }
  .qr { display: block; background: #fff; padding: 12px; width: clamp(140px, 12vw, 220px); aspect-ratio: 1; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .qr:focus-visible { outline: 3px solid #FFD23F; outline-offset: 4px; }
  .now { font-size: clamp(16px, 1.3vw, 22px); color: rgba(255, 255, 255, .7); }
  .here { display: grid; gap: 8px; max-width: 360px; }
  .here label { font-size: clamp(15px, 1.1vw, 19px); color: rgba(255, 255, 255, .8); }
  .here input { font: inherit; font-size: 22px; color: #fff; background: #24211C; border: 1.5px solid rgba(255, 255, 255, .22); padding: 12px 14px; font-variation-settings: 'wght' 60; }
  .here input:focus-visible { outline: 3px solid #FFD23F; outline-offset: 3px; }
  .now b { color: #fff; font-variation-settings: 'wght' 90; font-weight: inherit; }
  .stage svg { display: block; width: 100%; max-height: 92vh; }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <section class="call">
    <h1>מה עבר עליך היום?</h1>
    <p>סרוק, כתוב את השם שלך, והחיישן יספר לך על היום שלך: מה הרגשת, מתי, וכמה רחוק זה היה ממה שהראית.</p>
    <a class="qr" id="qr" aria-label="לעמוד האישי שלך: הקלד את השם שלך וסנכרן את החיישן"></a>
    <div class="here">
      <label for="here">או כתוב את השם שלך כאן</label>
      <input id="here" maxlength="20" autocomplete="off" enterkeyhint="done" placeholder="השם שלך">
    </div>
    <div class="now" id="now" aria-live="polite"></div>
  </section>
  <section class="stage"><svg id="stage"></svg></section>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="shape.js"></script>
<script src="motion.js"></script>
<script src="copy.js"></script>
<script src="days.js"></script>
<script src="gen.js"></script>
<script src="story-core.js"></script>
<script src="story.js"></script>
<script src="sync.js"></script>
<script>
  // the QR (and the link under it) opens the visitor's page. Hosted: this deployment's own me.html.
  // Running locally, a phone can't reach localhost, so it points at the public GitHub Pages copy instead.
  const PUBLIC = 'https://shapidesign.github.io/Wheep/v2/me.html';
  const local = location.protocol === 'file:' || /^(localhost|127\.|\[::1\]|.*\.local$)/.test(location.hostname);
  const target = local ? PUBLIC : new URL('me.html', location.href).href;
  document.getElementById('qr').href = target;
  try {
    const qr = qrcode(0, 'M'); qr.addData(target); qr.make();
    document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
  } catch (e) { document.getElementById('qr').textContent = target; }

  // attract mode: six (made-up) men, one per profile; ?names=a,b,c swaps in other names (synced by name)
  const MOCK = Object.keys(MOCK_NAMES).map(n => [n]);   // gen.js fixes their profiles, so a phone gets the same story
  const custom = new URLSearchParams(location.search).get('names');
  const people = custom ? custom.split(',').map(s => [s.trim()]).filter(p => p[0]) : MOCK;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let idx = -1, story = null, start = 0, visitor = null;
  const stage = document.getElementById('stage'), now = document.getElementById('now');
  function show(name, top, t, isVisitor) {
    story = createStory(stage, makeDay({ name, date: new Date(), top }));
    start = t; visitor = isVisitor ? name : null;
    now.innerHTML = `עכשיו על המסך: <b>${name.replace(/[<>&]/g, '')}</b>`;
    if (reduce) story.draw(sAt(4, 1.5));
  }
  function next(t) { idx = (idx + 1) % people.length; show(people[idx][0], people[idx][1], t, false); }
  function tick(t) {
    // a visitor's story plays twice, then the screen goes back to the six
    if (!story || t - start > STORY_DUR * 1000 * (visitor ? 2 : 1)) next(t);
    story.draw((t - start) / 1000);
    requestAnimationFrame(tick);
  }
  // a name typed at the screen: the story restarts at once, in that name
  let typing = null;
  document.getElementById('here').addEventListener('input', ev => {
    clearTimeout(typing);
    typing = setTimeout(() => {
      const name = ev.target.value.trim().replace(/\s+/g, ' ');
      if (name && name !== visitor) show(name, null, performance.now(), true);
    }, 450);
  });
  // a name from a visitor's phone (through the relay in sync.js): same as typing it here
  syncListen(name => { document.getElementById('here').value = ''; show(name, null, performance.now(), true); });
  document.fonts.ready.then(() => reduce ? next(0) : requestAnimationFrame(tick));
</script>
</body>
</html>
