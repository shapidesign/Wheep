<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WHEEP · חי</title>
<link rel="stylesheet" href="v2.css">
<style>
  /* the exhibition screen, made for a vertical display: the story fills it, one thin strip at the bottom.
     The QR is small (or gone, ?qr=0, when it is printed next to the screen). F or the corner button: story only, full screen. */
  html, body { height: 100%; }
  /* one unit for the strip that holds on any shape of screen: vh on a wide one, tied to the width on a tall, narrow one */
  :root { --u: min(1vh, 1.6vw); }
  body { background: #16130F; color: #fff; overflow: hidden; display: grid; grid-template-rows: minmax(0, 1fr) auto; font-variation-settings: 'wght' 40; }
  .stage { position: relative; display: grid; place-items: center; min-height: 0; }
  .stage svg { display: block; height: 100%; width: auto; max-width: 100%; overflow: visible; }
  .strip { position: relative; z-index: 1; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: calc(2.2 * var(--u)); align-items: center;
    padding: calc(1.6 * var(--u)) calc(3 * var(--u)) calc(1.6 * var(--u) + env(safe-area-inset-bottom)); background: #16130F; border-top: 1px solid rgba(255, 255, 255, .14); }
  .qr { display: block; background: #fff; padding: calc(.6 * var(--u)); width: calc(9 * var(--u)); aspect-ratio: 1; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .qr:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #FFD23F; outline-offset: 3px; }
  .call { display: grid; gap: calc(.5 * var(--u)); min-width: 0; }
  .call b { font-size: calc(1.8 * var(--u)); line-height: 1.2; font-variation-settings: 'wght' 90; font-weight: inherit; text-wrap: balance; }
  .now { font-size: calc(1.4 * var(--u)); color: rgba(255, 255, 255, .7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now b { color: #fff; font-size: inherit; }
  .tools { display: grid; gap: calc(.8 * var(--u)); justify-items: end; }
  .tools input { font: inherit; font-size: calc(1.5 * var(--u)); width: calc(15 * var(--u)); color: #fff; background: #24211C; border: 1px solid rgba(255, 255, 255, .22); padding: calc(.8 * var(--u)) var(--u); font-variation-settings: 'wght' 60; }
  .tools button, .exit { font: inherit; font-size: calc(1.3 * var(--u)); color: #fff; background: transparent; border: 1px solid rgba(255, 255, 255, .3); padding: calc(.6 * var(--u)) calc(1.2 * var(--u)); cursor: pointer; }
  body.noqr .qr { display: none; }
  body.noqr .strip { grid-template-columns: minmax(0, 1fr) auto; }
  /* story only: the strip goes, the poster's ground runs to the screen edges */
  body.only { grid-template-rows: minmax(0, 1fr); }
  body.only .strip { display: none; }
  .exit { position: fixed; inset: 1.5vh 1.5vh auto auto; z-index: 2; opacity: 0; transition: opacity .3s; }
  body.only .exit { display: block; }
  body:not(.only) .exit { display: none; }
  body.only .exit:hover, body.only .exit:focus-visible { opacity: 1; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
</style>
</head>
<body>
  <section class="stage"><svg id="stage"></svg></section>
  <footer class="strip">
    <a class="qr" id="qr" aria-label="לעמוד האישי שלך: הקלד את השם שלך וסנכרן את החיישן"></a>
    <div class="call">
      <b id="callLine">סרוק וכתוב את השם שלך. היום שלך יעלה על המסך.</b>
      <div class="now" id="now" aria-live="polite"></div>
    </div>
    <div class="tools">
      <label class="sr" for="here">או כתוב את השם שלך כאן</label>
      <input id="here" maxlength="20" autocomplete="off" enterkeyhint="done" placeholder="או כתוב שם כאן">
      <button type="button" id="full">מסך מלא · F</button>
    </div>
  </footer>
  <button type="button" class="exit" id="exit">יציאה · F</button>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="shape.js"></script>
<script src="motion.js"></script>
<script src="copy.js"></script>
<script src="days.js"></script>
<script src="gen.js"></script>
<script src="story-core.js"></script>
<script src="story.js"></script>
<script src="sync.js"></script>
<script>
  // the QR (and the link under it) opens the visitor's page. Hosted: this deployment's own me.html.
  // Running locally, a phone can't reach localhost, so it points at the public GitHub Pages copy instead.
  const PUBLIC = 'https://shapidesign.github.io/Wheep/v2/me.html';
  const local = location.protocol === 'file:' || /^(localhost|127\.|\[::1\]|.*\.local$)/.test(location.hostname);
  const target = local ? PUBLIC : new URL('me.html', location.href).href;
  const qrEl = document.getElementById('qr'), callLine = document.getElementById('callLine');
  let qrFor = null;
  function setQR(url) {   // the general link, or (on a person's last poster) the link to their own story, to share
    if (url === qrFor) return; qrFor = url; qrEl.href = url;
    try { const qr = qrcode(0, 'M'); qr.addData(url); qr.make(); qrEl.innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true }); }
    catch (e) { qrEl.textContent = url; }
  }
  setQR(target);
  const Q = new URLSearchParams(location.search);
  if (Q.get('qr') === '0') document.body.classList.add('noqr');   // the QR is printed next to the screen

  // story only, full screen: the button, F, or ?only=1 (story only without full screen; browsers need a click for that)
  const only = on => { document.body.classList.toggle('only', on); };
  async function toggleFull() {
    const on = !document.body.classList.contains('only');
    only(on);
    try { if (on && !document.fullscreenElement) await document.documentElement.requestFullscreen(); else if (!on && document.fullscreenElement) await document.exitFullscreen(); } catch (e) { /* story only still works */ }
  }
  document.addEventListener('fullscreenchange', () => only(!!document.fullscreenElement));
  document.getElementById('full').addEventListener('click', toggleFull);
  document.getElementById('exit').addEventListener('click', toggleFull);
  addEventListener('keydown', ev => { if ((ev.key === 'f' || ev.key === 'F' || ev.key === 'כ') && ev.target.tagName !== 'INPUT') toggleFull(); });
  if (Q.get('only') === '1') only(true);

  // attract mode: six (made-up) men, one per profile; ?names=a,b,c swaps in other names (synced by name)
  const MOCK = Object.keys(MOCK_NAMES).map(n => [n]);   // gen.js fixes their profiles, so a phone gets the same story
  const custom = Q.get('names');
  const people = custom ? custom.split(',').map(s => [s.trim()]).filter(p => p[0]) : MOCK;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let idx = -1, story = null, start = 0, visitor = null;
  const stage = document.getElementById('stage'), now = document.getElementById('now');
  // visitors queue up: each one's wrapped plays through once, then the next; with no one waiting, the six come back
  const queue = [];
  const esc = n => n.replace(/[<>&]/g, '');
  const base = n => n.replace(/[ךםןףץ]/g, c => 'כמנפצ'['ךםןףץ'.indexOf(c)]);   // final letters change while typing: רון → רונן
  const same = (a, b) => !!a && !!b && (base(a).startsWith(base(b)) || base(b).startsWith(base(a)));   // still typing, not a new person
  function caption() {
    now.innerHTML = `עכשיו על המסך: <b>${esc(story.day.name)}</b>` + (queue.length ? ` · הבא בתור: ${queue.map(esc).join(', ')}` : '');
  }
  function show(name, top, t, isVisitor) {
    story = createStory(stage, makeDay({ name, date: new Date(), top }), { bleed: true });
    start = t; visitor = isVisitor ? name : null;
    caption();
    if (reduce) story.draw(sAt(4, 1.5));
  }
  function next(t) {
    if (queue.length) return show(queue.shift(), null, t, true);
    idx = (idx + 1) % people.length; show(people[idx][0], people[idx][1], t, false);
  }
  function arrive(name) {
    const t = performance.now();
    if (same(name, visitor)) show(name, null, t, true);                          // a correction of who's on screen: restart in it
    else if (same(name, queue[queue.length - 1])) queue[queue.length - 1] = name;   // a correction of who's waiting
    else if (!visitor) show(name, null, t, true);                                 // only the six were playing: start at once
    else if (!queue.includes(name)) queue.push(name);
    caption();
  }
  function tick(t) {
    if (!story || t - start > STORY_DUR * 1000) next(t);   // one whole wrapped, then the next person
    const T = (t - start) / 1000;
    story.draw(T);
    // each person's last poster: the QR becomes theirs, so they can take the poster with them and share it
    const end = T >= SCENES[SCENES.length - 2];
    setQR(end ? `${target}?name=${encodeURIComponent(story.day.name)}` : target);
    const line = end ? `${story.day.name}, סרוק כדי לקחת את הפוסטר ולשתף אותו.` : 'סרוק וכתוב את השם שלך. היום שלך יעלה על המסך.';
    if (callLine.textContent !== line) callLine.textContent = line;
    requestAnimationFrame(tick);
  }
  // a name typed at the screen, or sent from a visitor's phone (through the relay in sync.js)
  let typing = null;
  document.getElementById('here').addEventListener('input', ev => {
    clearTimeout(typing);
    typing = setTimeout(() => { const name = ev.target.value.trim().replace(/\s+/g, ' '); if (name) arrive(name); }, 450);
  });
  syncListen(name => { document.getElementById('here').value = ''; arrive(name); });
  document.fonts.ready.then(() => reduce ? next(0) : requestAnimationFrame(tick));
</script>
</body>
</html>
