<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WHEEP · Wrapped יומי</title>
<link rel="stylesheet" href="v2.css">
<link rel="stylesheet" href="../switch.css">
<style>
  main { max-width: 1400px; margin: 0 auto; padding: 96px 24px 96px; }   /* top room for the switch */
  header h1 { font-size: clamp(48px, 7vw, 96px); line-height: .95; font-variation-settings: 'wght' 90; }
  header p { font-size: 19px; margin-top: 12px; max-width: 600px; line-height: 1.4; }
  header a { color: inherit; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; margin-top: 40px; }
  /* a click (or Space/Enter) on a poster pauses it, like TikTok; again to play on */
  .card { position: relative; margin: 0; display: grid; gap: 10px; }
  .card .poster { cursor: pointer; }
  .card .poster:focus-visible { outline: 3px solid #FFD23F; outline-offset: 4px; }
  .card::after { content: 'מושהה · לחיצה ממשיכה'; position: absolute; top: 18px; inset-inline: 0; margin-inline: auto; width: max-content;
    padding: 8px 14px; background: rgba(22, 19, 15, .86); color: #fff; font-size: 15px; font-variation-settings: 'wght' 70;
    opacity: 0; transform: translateY(-6px); transition: opacity .2s ease-out, transform .2s ease-out; pointer-events: none; }
  .card.paused::after { opacity: 1; transform: none; }
  .card a { color: inherit; font-size: 15px; opacity: .75; justify-self: start; }
  .card a:hover { opacity: 1; }
  body.solo .card a { display: none; }
  .poster { display: block; width: 100%; height: auto; }
  body.solo { display: grid; place-items: center; min-height: 100vh; background: #000; }
  body.solo main { padding: 0; }
  body.solo header { display: none; }
  body.solo .grid { margin: 0; display: block; }
  body.solo .poster { width: min(100vw, 80vh); }
</style>
</head>
<body>
<nav class="page-switch" aria-label="WHEEP">
  <a href="../index.html">לאפליקציה</a>
  <a href="wrapped.html" aria-current="page">לסיכום</a>
</nav>
<main>
  <header>
    <h1>מה עבר עליך היום.</h1>
    <p>שבוע של אדם אחד, שבעה סיכומים יומיים. כל אחד הוא סיפור קצר של פחות מדקה: השם, הרגש שהוביל, מה נמדד ומתי, הפער בין בחוץ לבפנים, והיום כולו ברגשות. כמו סטורי: לחיצה בצד שמאל של פוסטר עוברת לבא, בצד ימין לקודם, ובאמצע עוצרת. <a href="live.html">לגרסה החיה</a>.</p>
  </header>
  <div class="grid" id="grid"></div>
</main>
<script src="shape.js"></script>
<script src="motion.js"></script>
<script src="copy.js"></script>
<script src="days.js"></script>
<script src="gen.js"></script>
<script src="story-core.js"></script>
<script src="story.js"></script>
<script>
  const q = new URLSearchParams(location.search), one = q.get('day');
  const fixedT = q.has('t') ? +q.get('t') : null;      // ?t=12 freezes the story at that second
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const grid = document.getElementById('grid'), t0 = performance.now();

  const stories = DAYS.map((d, i) => {
    if (one !== null && +one !== i + 1) return null;
    const seed = nameSeed(DEMO_NAME, d.date);
    const day = { ...d, name: DEMO_NAME, seed, ...genMix(seed, d.emo) };
    const card = document.createElement('figure'); card.className = 'card';
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'poster');
    svg.setAttribute('tabindex', '0');
    const open = document.createElement('a'); open.href = `?day=${i + 1}`; open.textContent = `יום ${d.day} לבד`;
    card.append(svg, open); grid.append(card);
    const st = createStory(svg, day);
    svg.setAttribute('aria-pressed', 'false');   // after createStory, which sets role=img; the click target is a toggle
    svg.setAttribute('role', 'button');
    st.svg = svg; st.card = card; st.seen = false; st.off = 0; st.held = null;
    const toggle = () => {
      const T = (performance.now() - t0) / 1000;
      if (st.held === null) st.held = T - st.off; else { st.off = T - st.held; st.held = null; }
      card.classList.toggle('paused', st.held !== null); svg.setAttribute('aria-pressed', String(st.held !== null));
    };
    // like a story: the left side of the poster is the next story, the right side the one before (it moves right to left), the middle pauses
    const jump = step => {
      const now = (performance.now() - t0) / 1000, T = sWrap(st.held ?? now - st.off);
      let j = 0; while (j < SCENES.length - 2 && T >= SCENES[j + 1]) j++;
      const to = step > 0 ? (j >= SCENES.length - 2 ? 0 : SCENES[j + 1]) : (T - SCENES[j] > 1.2 ? SCENES[j] : SCENES[Math.max(0, j - 1)]);
      if (st.held !== null) st.held = to; else st.off = now - to;
    };
    svg.addEventListener('click', ev => {
      const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width;
      if (x < .3) jump(1); else if (x > .7) jump(-1); else toggle();
    });
    svg.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') jump(1); else if (e.key === 'ArrowRight') jump(-1);
      else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); }
    });
    return st;
  }).filter(Boolean);
  // only the stories on screen are drawn: seven at once is what made the page stutter
  const io = new IntersectionObserver(es => es.forEach(e => { stories.find(s => s.svg === e.target).seen = e.isIntersecting; }));
  stories.forEach(s => io.observe(s.svg));
  if (one !== null) document.body.classList.add('solo');

  // each story starts where it is when the page opens; reduced motion holds on the day in feelings
  // each story keeps its own clock, so pausing one doesn't stop the others
  function frame(t) { stories.forEach(s => { if (s.seen) s.draw(s.held ?? (t - t0) / 1000 - s.off); }); requestAnimationFrame(frame); }
  document.fonts.ready.then(() => fixedT !== null || reduce ? stories.forEach(s => s.draw(fixedT ?? sAt(4, 1.5))) : requestAnimationFrame(frame));
</script>
</body>
</html>
