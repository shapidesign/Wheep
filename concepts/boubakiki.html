<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WHEEP · קונספט Bouba/Kiki</title>
<style>
@font-face { font-family: Leon; src: url(../fonts/Leon-ProductThin.otf); font-weight: 200; }
@font-face { font-family: Leon; src: url(../fonts/Leon-ProductRegular.otf); font-weight: 400; }
@font-face { font-family: Leon; src: url(../fonts/Leon-ProductBold.otf); font-weight: 700; }
@font-face { font-family: Leon; src: url(../fonts/Leon-ProductHeavy.otf); font-weight: 900; }
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --ink: #F2F4FF; --ink-2: #C9D0F5; --ink-3: #A3ACDD; --line: rgba(190, 200, 255, .16); --river: #6CF4FF; --amber: #FF9A4A; }
html, body { height: 100%; }
body {
  font-family: Leon, system-ui, sans-serif; color: var(--ink); overflow: hidden;
  background: linear-gradient(180deg, #0A0E2E 0%, #15195A 45%, #12406A 80%, #0C5A66 100%);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--river); outline-offset: 3px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.app { height: 100%; display: flex; flex-direction: column; padding: 22px 20px 20px; max-width: 430px; margin: 0 auto; }
.top { display: flex; justify-content: space-between; align-items: baseline; }
.brand { font-weight: 900; letter-spacing: .2em; font-size: 15px; direction: ltr; }
.date { font-size: 14px; color: var(--ink-2); }

.stage { position: relative; flex: none; height: 330px; margin-top: 6px; display: grid; place-items: center; }
.stage svg { width: 320px; height: 320px; overflow: visible; }
#ego { transition: fill .6s, stroke .6s; }
.readout { text-align: center; margin-top: -6px; }
.state { font-size: 28px; font-weight: 700; }
.sub { margin-top: 4px; font-size: 15px; color: var(--ink-2); }
.sub b { color: var(--ink); font-weight: 700; }

.scale { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 18px; padding: 10px 14px; border-radius: 16px; background: rgba(120, 140, 255, .09); box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; color: var(--ink-2); }
.scale div { display: flex; align-items: center; gap: 6px; }
.scale svg { width: 26px; height: 26px; }

.strip-h { display: flex; justify-content: space-between; margin-top: 20px; font-size: 14px; font-weight: 700; color: var(--ink-2); }
.strip-h span { font-weight: 400; color: var(--ink-2); }
.strip { display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px; margin-top: 10px; }
.day { display: grid; justify-items: center; gap: 4px; padding: 6px 0; border-radius: 10px; font-size: 11px; color: var(--ink-2); }
.day svg { width: 20px; height: 20px; overflow: visible; }
.day.is-sel { background: rgba(242, 244, 255, .12); color: var(--ink); }
.day.is-fc svg path { stroke-dasharray: 2 2.5; }
.day:hover { background: rgba(242, 244, 255, .07); }
.note { margin-top: 14px; font-size: 14px; color: var(--ink-2); line-height: 1.45; min-height: 42px; }
.note b { color: var(--ink); }
</style>
</head>
<body>
<main class="app">
  <header class="top"><span class="brand">WHEEP</span><span class="date" id="date">ג׳ 15.12 · תל אביב-יפו</span></header>

  <div class="stage" aria-live="polite">
    <svg viewBox="0 0 320 320" role="img" id="ego-svg" aria-label="צורת הלחץ של היום">
      <defs>
        <radialGradient id="g-fill" cx=".5" cy=".5" r=".55">
          <stop offset="0" id="g-in" stop-color="#FF9A4A" stop-opacity=".55"/>
          <stop offset="1" id="g-out" stop-color="#FF9A4A" stop-opacity=".05"/>
        </radialGradient>
      </defs>
      <path id="ego" fill="url(#g-fill)" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="160" y="172" text-anchor="middle" class="num" id="press" style="font-family:Leon;font-weight:200;font-size:46px;fill:#F2F4FF">1031</text>
      <text x="160" y="198" text-anchor="middle" style="font-family:Leon;font-weight:700;font-size:13px;fill:#C9D0F5">לחץ פנימי</text>
    </svg>
  </div>

  <div class="readout">
    <p class="state" id="state">חד</p>
    <p class="sub" id="sub"><b class="num">12</b> ימים ללא משקעים</p>
  </div>

  <div class="scale" aria-label="מקרא">
    <div><svg viewBox="0 0 48 48"><path data-r="0"/></svg>לחץ</div>
    <div><svg viewBox="0 0 48 48"><path data-r=".5"/></svg>מתוח</div>
    <div><svg viewBox="0 0 48 48"><path data-r="1"/></svg>שחרור</div>
  </div>

  <div class="strip-h">16 ימים<span>הקש על יום</span></div>
  <div class="strip" id="strip" role="group" aria-label="צורת הלחץ בכל יום"></div>
  <p class="note" id="note"></p>
</main>

<script>
// Bouba/Kiki: the whole interface is one shape. Pressure sharpens it, release rounds it.
const DAYS = ['3.12','4.12','5.12','6.12','7.12','8.12','9.12','10.12','11.12','12.12','13.12','14.12','15.12','16.12','17.12','18.12'];
const DOW  = ['ה׳','ו׳','ש׳','א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳','א׳','ב׳','ג׳','ד׳','ה׳','ו׳'];
const FLOW = [1, .72, .5, .36, .27, .21, .17, .14, .12, .1, .09, .08, .07, .07, .08, .62];
const PRESS = [1009, 1011, 1013, 1014, 1016, 1018, 1020, 1022, 1024, 1025, 1027, 1029, 1031, 1032, 1033, 1018];
const NOTES = {
  0: '<b>3.12</b> · 11 דק׳ בכי ברמזור בדרך הביתה. הצורה כמעט עגולה.',
  3: '<b>6.12</b> · החיישן הוסר בין 02:10 ל-07:40. הצורה נמדדה חלקית.',
  6: '<b>9.12</b> · דמעה לא מאומתת. סיבה אפשרית: בצל.',
  10: '<b>13.12</b> · פקק באיילון. 40 דקות של שתיקה. קוץ חדש.',
  12: '<b>היום</b> · 12 ימים ללא משקעים. 9 הדחקות השבוע.',
  15: '<b>ו׳ 18.12</b> · תחזית: 60% שהצורה תתעגל. ארוחת ערב משפחתית.',
};
const TODAY = 12;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function shape(round, R, cx, cy, n, jitter = []) {
  const inner = .42 + .55 * round, c = .5 * round;
  const v = Array.from({ length: n * 2 }, (_, i) => {
    const a = -Math.PI / 2 + i * Math.PI / n;
    const r = R * (i % 2 ? inner : 1) * (1 + (jitter[i] || 0));
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  });
  const f = (x) => x.toFixed(2);
  return v.map((p, i) => {
    const pr = v[(i + v.length - 1) % v.length], nx = v[(i + 1) % v.length];
    const a = [p[0] + (pr[0] - p[0]) * c, p[1] + (pr[1] - p[1]) * c];
    const b = [p[0] + (nx[0] - p[0]) * c, p[1] + (nx[1] - p[1]) * c];
    return `${i ? 'L' : 'M'}${f(a[0])} ${f(a[1])}Q${f(p[0])} ${f(p[1])} ${f(b[0])} ${f(b[1])}`;
  }).join('') + 'Z';
}
const color = (r) => {
  const A = [255, 154, 74], B = [108, 244, 255];
  return `rgb(${A.map((x, i) => Math.round(x + (B[i] - x) * r)).join(',')})`;
};
const roundOf = (i) => Math.min(1, FLOW[i] * 1.1);
const words = (r) => (r > .7 ? 'עגול' : r > .35 ? 'מתוח' : 'חד');

// legend
document.querySelectorAll('.scale path').forEach((p) => {
  const r = +p.dataset.r; p.setAttribute('d', shape(r, 18, 24, 24, 9)); p.setAttribute('fill', 'none');
  p.setAttribute('stroke', color(r)); p.setAttribute('stroke-width', 2.2); p.setAttribute('stroke-linejoin', 'round');
});

// strip of days
const strip = document.getElementById('strip');
strip.innerHTML = DAYS.map((d, i) => `<button class="day${i > TODAY ? ' is-fc' : ''}" data-i="${i}" aria-label="${DOW[i]} ${d}"><svg viewBox="0 0 48 48"><path d="${shape(roundOf(i), 18, 24, 24, 9)}" fill="none" stroke="${color(roundOf(i))}" stroke-width="3" stroke-linejoin="round"/></svg>${i === TODAY ? 'היום' : DOW[i]}</button>`).join('');

let sel = TODAY, shown = roundOf(TODAY), target = shown, t0 = 0;
const ego = document.getElementById('ego');
function select(i) {
  sel = i; target = roundOf(i);
  strip.querySelectorAll('.day').forEach((b) => b.classList.toggle('is-sel', +b.dataset.i === i));
  document.getElementById('press').textContent = PRESS[i];
  document.getElementById('state').textContent = (i > TODAY ? 'צפוי: ' : '') + words(target);
  document.getElementById('sub').innerHTML = i === TODAY ? '<b class="num">12</b> ימים ללא משקעים'
    : i === 0 ? 'יום של משקעים' : i > TODAY ? `תחזית · ${DOW[i]} ${DAYS[i]}` : `<b class="num">${i}</b> ימים ללא משקעים · ${DOW[i]} ${DAYS[i]}`;
  document.getElementById('note').innerHTML = NOTES[i] || `<b>${DAYS[i]}</b> · יבש. אין רישום.`;
}
strip.addEventListener('click', (e) => { const b = e.target.closest('.day'); if (b) select(+b.dataset.i); });

// the shape eases toward its target and trembles in proportion to pressure
function frame(t) {
  shown += (target - shown) * .08;
  const tremble = reduced ? 0 : (1 - shown) * .045;
  const jit = Array.from({ length: 22 }, (_, k) => tremble * Math.sin(t / 140 + k * 1.7) * (k % 2 ? .4 : 1));
  ego.setAttribute('d', shape(shown, 128, 160, 160, 11, jit));
  const c = color(shown);
  ego.setAttribute('stroke', c);
  document.getElementById('g-in').setAttribute('stop-color', c);
  document.getElementById('g-out').setAttribute('stop-color', c);
  requestAnimationFrame(frame);
}
select(TODAY);
requestAnimationFrame(frame);
</script>
</body>
</html>
