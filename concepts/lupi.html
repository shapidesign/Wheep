<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WHEEP · קונספט Lupi</title>
<style>
@font-face { font-family: Leon; src: url(../fonts/Leon-ProductThin.otf); font-weight: 200; }
@font-face { font-family: Leon; src: url(../fonts/Leon-ProductRegular.otf); font-weight: 400; }
@font-face { font-family: Leon; src: url(../fonts/Leon-ProductBold.otf); font-weight: 700; }
@font-face { font-family: Leon; src: url(../fonts/Leon-ProductHeavy.otf); font-weight: 900; }
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --ink: #1D2140; --ink-2: #464B70; --grid: #DCE5EF; --paper: #FAFAF7; }
html, body { height: 100%; }
body {
  font-family: Leon, system-ui, sans-serif; color: var(--ink); overflow: hidden;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 16px 16px; background-position: -1px -1px;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.app { height: 100%; display: flex; flex-direction: column; padding: 22px 20px 18px; max-width: 430px; margin: 0 auto; }
.top { display: flex; justify-content: space-between; align-items: baseline; }
.brand { font-weight: 900; letter-spacing: .2em; font-size: 15px; direction: ltr; }
.date { font-size: 14px; color: var(--ink-2); }
.title { margin-top: 14px; display: flex; justify-content: space-between; align-items: flex-end; }
.title h1 { font-size: 30px; font-weight: 700; line-height: 1.05; }
.title p { font-size: 14px; color: var(--ink-2); margin-top: 4px; }
.count { position: relative; text-align: center; width: 92px; flex: none; }
.count b { display: block; font-size: 46px; font-weight: 200; line-height: 1; }
.count span { font-size: 13px; color: var(--ink-2); }
.count svg { position: absolute; inset: -10px -6px; width: calc(100% + 12px); height: calc(100% + 20px); overflow: visible; pointer-events: none; }
.card { margin-top: 14px; flex: none; }
.card svg { width: 100%; height: auto; overflow: visible; display: block; }
.card text { font-family: Leon, sans-serif; }
.key { margin-top: 10px; padding: 10px 12px; border: 1.5px solid var(--ink); border-radius: 4px; background: rgba(250, 250, 247, .9); display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: 13px; color: var(--ink-2); rotate: -.6deg; }
.key h2 { grid-column: 1 / -1; font-size: 13px; font-weight: 700; color: var(--ink); }
.key div { display: flex; align-items: center; gap: 6px; }
.key svg { width: 20px; height: 20px; flex: none; overflow: visible; }
.tip { margin-top: 10px; font-size: 14px; color: var(--ink-2); min-height: 40px; line-height: 1.4; }
.tip b { color: var(--ink); }
.mark { cursor: pointer; }
.mark:hover path, .mark:focus path { stroke-width: 2.6; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="pencil" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11"/>
    <feDisplacementMap in="SourceGraphic" scale="2.6"/>
  </filter>
</svg>

<main class="app">
  <header class="top"><span class="brand">WHEEP</span><span class="date">ג׳ 15.12</span></header>

  <div class="title">
    <div>
      <h1>השבוע שלי</h1>
      <p>9–15 בדצמבר · מצויר ביד מנתוני החיישן</p>
    </div>
    <div class="count">
      <b class="num">12</b><span>ימים יבשים</span>
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M52 6C82 4 97 24 95 50S78 95 48 94 3 74 5 47 26 9 58 9" fill="none" stroke="#F2672E" stroke-width="1.6" filter="url(#pencil)" vector-effect="non-scaling-stroke"/></svg>
    </div>
  </div>

  <div class="card"><svg id="card" viewBox="0 0 350 400" role="img" aria-label="שבוע מצויר: לחץ עולה, דמעה לא מאומתת, הדחקות וכעס"></svg></div>

  <div class="key" aria-label="איך לקרוא">
    <h2>איך לקרוא</h2>
    <div><svg viewBox="0 0 24 24"><path data-g="cry"/></svg>בכי</div>
    <div><svg viewBox="0 0 24 24"><path data-g="anger"/></svg>כעס שלא נאמר</div>
    <div><svg viewBox="0 0 24 24"><path data-g="press"/></svg>הדחקה</div>
    <div><svg viewBox="0 0 24 24"><path data-g="empathy"/></svg>שיחה ארוכה</div>
    <div>גודל = עוצמה</div>
    <div>מקווקו = לא מאומת</div>
  </div>
  <p class="tip" id="tip">הקש על סימן כדי לקרוא מה קרה.</p>
</main>

<script>
// Lupi: the week drawn by hand, small data with context, uncertainty left visible.
const G = {
  cry:     { c: '#1E8FCF', d: 'M12.2 2.9C10 7.1 6.9 10.2 7.2 14.4c.3 3.6 2.6 6 5.1 5.9 3-.2 5-2.7 4.6-6.2-.4-3.3-2.9-6.6-4.7-11.2z' },
  anger:   { c: '#F2672E', d: 'M12.0 1.8L13.2 8.6L18.1 6.3L16.0 10.3L21.5 9.5L15.4 12.3L19.2 17.2L14.3 15.4L16.0 21.6L12.2 15.7L8.2 19.2L8.7 14.9L4.2 17.6L8.6 12.9L3.1 9.9L8.7 9.8L5.6 4.3L10.7 8.4z' },
  empathy: { c: '#C8459E', d: 'M12 11.4C9.3 5.2 4.3 7.6 7.7 11.9c-4 3.4.9 8.2 4.1 1.4 3.1 6.4 8.4 2.5 4.4-1.4 3.9-4-1.4-7.2-4.2-.5z' },
  press:   { c: '#5D6286', d: 'M8.7 3.3l7.2-.2 4.9 5.4.1 7.1-5.2 5.2-7.4-.1-5-5.3.3-7.2z' },
};
document.querySelectorAll('.key path').forEach((p) => {
  const g = G[p.dataset.g]; p.setAttribute('d', g.d); p.setAttribute('stroke', g.c);
  p.setAttribute('fill', 'none'); p.setAttribute('stroke-width', 1.8); p.setAttribute('filter', 'url(#pencil)');
});

// columns run right → left: Wednesday 9.12 … today
const DAYS = ['ד׳ 9', 'ה׳ 10', 'ו׳ 11', 'ש׳ 12', 'א׳ 13', 'ב׳ 14', 'היום'];
const colX = (i) => 325 - i * 49;
// [day index, glyph, size, y, dashed, tip]
const MARKS = [
  [0, 'cry', 30, 205, true, '<b>ד׳ 9.12</b> · דמעה לא מאומתת, 0.4 מ״ל. הוא כתב: "אולי בצל. אולי לא."'],
  [1, 'press', 18, 180, false, '<b>ה׳ 10.12</b> · "הכל טוב, אחי". פעמיים.'],
  [1, 'press', 18, 212, false, '<b>ה׳ 10.12</b> · "הכל טוב, אחי". פעמיים.'],
  [1, 'empathy', 22, 250, false, '<b>ה׳ 10.12</b> · שיחה של 24 דקות עם שירי.'],
  [2, 'press', 24, 168, false, '<b>ו׳ 11.12</b> · ארוחת שישי. שלוש פעמים "לא משנה".'],
  [2, 'press', 22, 200, false, '<b>ו׳ 11.12</b> · ארוחת שישי. שלוש פעמים "לא משנה".'],
  [2, 'press', 20, 230, false, '<b>ו׳ 11.12</b> · ארוחת שישי. שלוש פעמים "לא משנה".'],
  [4, 'anger', 40, 196, false, '<b>א׳ 13.12</b> · פקק באיילון. 40 דקות של שתיקה.'],
  [4, 'empathy', 18, 250, false, '<b>א׳ 13.12</b> · שיחה של 31 דקות עם עידו, בפקק.'],
  [5, 'press', 18, 186, false, '<b>ב׳ 14.12</b> · אבא שאל מה נשמע. "סבבה".'],
  [5, 'press', 18, 216, false, '<b>ב׳ 14.12</b> · אבא שאל מה נשמע. "סבבה".'],
  [5, 'empathy', 20, 252, false, '<b>ב׳ 14.12</b> · שיחה של 22 דקות. לא תויג עם מי.'],
  [6, 'press', 18, 186, false, '<b>היום</b> · "הכל בסדר". פעמיים עד עכשיו.'],
  [6, 'press', 18, 216, false, '<b>היום</b> · "הכל בסדר". פעמיים עד עכשיו.'],
];
const PRESS = [1020, 1022, 1024, 1025, 1027, 1029, 1031];
const py = (v) => 116 - (v - 1018) * 5.6;
// spread the marks over a taller sheet and draw them larger
const my = (y) => 150 + (y - 160) * 1.55, MS = 1.4;

const svg = document.getElementById('card');
let s = '';
// the pressure line, drawn by hand across the top
const pts = PRESS.map((v, i) => [colX(i), py(v)]);
s += `<path d="M${pts.map((p) => p.join(' ')).join(' L')}" fill="none" stroke="#1D2140" stroke-width="1.6" stroke-linecap="round" filter="url(#pencil)"/>`;
pts.forEach(([x, y]) => { s += `<circle cx="${x}" cy="${y}" r="2.4" fill="#1D2140" filter="url(#pencil)"/>`; });
s += `<text x="${colX(1)}" y="${py(1031) - 4}" font-size="12" fill="#464B70" text-anchor="middle" transform="rotate(-3 ${colX(1)} ${py(1031)})">הלחץ עולה כל יום · 1031</text>`;
// day rules and labels
DAYS.forEach((d, i) => {
  s += `<line x1="${colX(i)}" x2="${colX(i)}" y1="150" y2="356" stroke="#1D2140" stroke-opacity=".12" stroke-dasharray="2 4"/>`;
  s += `<text x="${colX(i)}" y="378" font-size="12" text-anchor="middle" fill="${i === 6 ? '#1D2140' : '#464B70'}" font-weight="${i === 6 ? 700 : 400}">${d}</text>`;
});
// marks
MARKS.forEach(([i, g, size, y, dashed, tip], k) => {
  size *= MS; y = my(y);
  const x = colX(i), sc = size / 24, rot = ((k * 37) % 13) - 6;
  s += `<g class="mark" tabindex="0" data-k="${k}" transform="translate(${x - size / 2} ${y - size / 2}) rotate(${rot} ${size / 2} ${size / 2}) scale(${sc})">
    <path d="${G[g].d}" fill="${G[g].c}" fill-opacity=".14" stroke="${G[g].c}" stroke-width="${1.8 / sc}" stroke-linejoin="round" ${dashed ? `stroke-dasharray="${3 / sc} ${3 / sc}"` : ''} filter="url(#pencil)"/></g>`;
});
// hand notes
s += `<text x="${colX(0)}" y="${my(232)}" font-size="13" text-anchor="middle" fill="#1E8FCF" font-weight="700">?</text>`;
s += `<text x="${colX(0) - 4}" y="${my(176)}" font-size="12" fill="#464B70" text-anchor="middle" transform="rotate(4 ${colX(0)} ${my(176)})">בצל?</text>`;
s += `<text x="${colX(3)}" y="${my(214)}" font-size="12" fill="#464B70" text-anchor="middle" transform="rotate(-4 ${colX(3)} ${my(214)})">ישנתי עד 11</text>`;
s += `<circle cx="${colX(6)}" cy="${my(252)}" r="13" fill="none" stroke="#5D6286" stroke-width="1.3" stroke-dasharray="2 3" filter="url(#pencil)"/>`;
s += `<text x="${colX(6)}" y="${my(252) + 30}" font-size="12" fill="#464B70" text-anchor="middle">לא תויג</text>`;
svg.innerHTML = s;

const tip = document.getElementById('tip');
svg.addEventListener('click', (e) => { const m = e.target.closest('.mark'); if (m) tip.innerHTML = MARKS[+m.dataset.k][5]; });
svg.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const m = e.target.closest('.mark'); if (m) tip.innerHTML = MARKS[+m.dataset.k][5]; } });
</script>
</body>
</html>
